name: Data-driven control

on:
  push:
    branches: [main, develop, feature/create_data_driven]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.MCAP_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate C++ samples and verify identical Python examples
        run: |
          cmp sample/vrft_demo.py external_libraries/MCAP_python_adaptive_control/sample/data_driven/vrft_demo.py
          cmp sample/frit_demo.py external_libraries/MCAP_python_adaptive_control/sample/data_driven/frit_demo.py
          python sample/vrft_demo.py
          python sample/frit_demo.py
      - name: Build with GCC in C++11 mode
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ && cmake --build build --parallel 2
      - name: C++ unit tests and example
        run: ctest --test-dir build --output-on-failure
      - name: Python unit tests
        run: python -m pytest external_libraries/MCAP_python_adaptive_control/tests -q
      - name: Python and C++ SIL
        run: python test_sil/test_data_driven_sil.py --executable build/data_driven_sil
      - name: Code generation and standalone sample integration
        run: python test_sil/test_codegen.py
      - name: Verify local reference is not tracked
        run: test -z "$(git ls-files '*.pdf')"
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.MCAP_SUBMODULE_TOKEN || github.token }}
      - name: Build and test with address and undefined behavior sanitizers
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DADAPTIVE_CONTROL_SANITIZERS=ON
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure
