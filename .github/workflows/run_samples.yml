name: Run samples

on:
  push:
    branches:
    - develop

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_samples:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: false
        persist-credentials: false
    - name: Checkout C++ dependencies
      run: 'git submodule update --init --depth 1 -- external_libraries/base_utility_cpp
        external_libraries/python_math_to_cpp external_libraries/python_numpy_to_cpp
        external_libraries/python_control_to_cpp external_libraries/python_optimization_to_cpp

        '
    - name: Install dependencies
      run: 'sudo apt update

        sudo apt install -y g++

        '
    - name: Run samples
      run: 'g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -O2 -I ./data_driven
        -I ./external_libraries/python_optimization_to_cpp/optimization_utility
        -I ./external_libraries/python_optimization_to_cpp/python_optimization -I
        ./external_libraries/python_control_to_cpp/python_control -I ./external_libraries/python_numpy_to_cpp/python_numpy
        -I ./external_libraries/python_numpy_to_cpp/base_matrix -I ./external_libraries/python_math_to_cpp/base_math
        -I ./external_libraries/python_math_to_cpp/python_math -I ./external_libraries/base_utility_cpp/base_utility
        -o ./sample/app ./sample/data_driven/vrft_demo.cpp

        ./sample/app 2>&1 | tee /tmp/vrft_demo.log

        if grep -q "ERROR:" /tmp/vrft_demo.log; then exit 1; fi

        grep -q "VRFT simulation complete." /tmp/vrft_demo.log

        g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -O2 -I ./data_driven
        -I ./external_libraries/python_optimization_to_cpp/optimization_utility
        -I ./external_libraries/python_optimization_to_cpp/python_optimization -I
        ./external_libraries/python_control_to_cpp/python_control -I ./external_libraries/python_numpy_to_cpp/python_numpy
        -I ./external_libraries/python_numpy_to_cpp/base_matrix -I ./external_libraries/python_math_to_cpp/base_math
        -I ./external_libraries/python_math_to_cpp/python_math -I ./external_libraries/base_utility_cpp/base_utility
        -o ./sample/app ./sample/data_driven/frit_demo.cpp

        ./sample/app 2>&1 | tee /tmp/frit_demo.log

        if grep -q "ERROR:" /tmp/frit_demo.log; then exit 1; fi

        grep -q "FRIT simulation complete." /tmp/frit_demo.log

        '
