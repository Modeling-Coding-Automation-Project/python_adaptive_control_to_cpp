name: Run SIL test

on:
  push:
    branches:
    - develop
    - feature/*

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_SIL:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install dependencies
      run: 'sudo apt update

        sudo apt install -y build-essential

        sudo apt install -y python3

        sudo apt install -y python3-venv

        '
    - name: Set up Python environment
      run: 'python3 -m venv /opt/venv_py_MCAP

        /opt/venv_py_MCAP/bin/pip install --upgrade pip

        /opt/venv_py_MCAP/bin/pip install --upgrade setuptools

        /opt/venv_py_MCAP/bin/pip install -r requirements.txt

        '
    - name: Build SIL C++ application
      run: 'g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -O2 -I ./data_driven
        -I ./external_libraries/python_optimization_to_cpp/optimization_utility
        -I ./external_libraries/python_optimization_to_cpp/python_optimization
        -I ./external_libraries/python_control_to_cpp/python_control
        -I ./external_libraries/python_numpy_to_cpp/python_numpy
        -I ./external_libraries/python_numpy_to_cpp/base_matrix
        -I ./external_libraries/python_math_to_cpp/base_math
        -I ./external_libraries/python_math_to_cpp/python_math
        -I ./external_libraries/base_utility_cpp/base_utility
        -o ./test_sil/app ./test_sil/data_driven_sil.cpp

        '
    - name: Run SIL tests
      run: '/opt/venv_py_MCAP/bin/python3 ./test_sil/test_data_driven_sil.py
        --executable ./test_sil/app

        '
    - name: Run Python reference tests
      run: '/opt/venv_py_MCAP/bin/python3 -m pytest
        ./external_libraries/MCAP_python_adaptive_control/tests -q

        '
