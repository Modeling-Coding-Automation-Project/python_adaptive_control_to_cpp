name: Run SIL test

on:
  push:
    branches:
    - develop

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_SIL:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install dependencies
      run: 'sudo apt update

        sudo apt install -y build-essential

        sudo apt install -y cmake

        sudo apt install -y python3

        sudo apt install -y python3-dev

        sudo apt install -y python3-venv

        '
    - name: Set up Python environment
      run: 'python3 -m venv /opt/venv_py_MCAP

        /opt/venv_py_MCAP/bin/pip install --upgrade pip

        /opt/venv_py_MCAP/bin/pip install --upgrade setuptools

        /opt/venv_py_MCAP/bin/pip install -r requirements.txt

        '
    - name: Run SIL tests
      run: '/opt/venv_py_MCAP/bin/python3 ./test_sil/vrft/vrft_demo_SIL.py

        /opt/venv_py_MCAP/bin/python3 ./test_sil/frit/frit_demo_SIL.py

        '
    - name: Run Python reference tests
      run: '/opt/venv_py_MCAP/bin/python3 -m pytest
        ./external_libraries/MCAP_python_adaptive_control/tests -q

        '
